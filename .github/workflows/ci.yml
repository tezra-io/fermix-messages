name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  swift:
    name: swift (build + test + bundle)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: scripts/swift_test.sh
      # The bundle must assemble and sign (ad-hoc here) on every push, so a broken
      # Info.plist or entitlements file never waits for tag time to fail.
      - run: scripts/build_app.sh .build/release/fermix-messages dist 0.0.0-ci ""
      - run: '"dist/Fermix Messages.app/Contents/MacOS/fermix-messages" --version'
